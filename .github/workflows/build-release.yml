name: Build and Release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 0"
      timezone: "Asia/Kolkata"

concurrency:
  group: prebuilts-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_updates: ${{ steps.summary.outputs.has_updates }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install aapt and GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt gh

      - name: Run unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Build and update platform releases
        run: python3 scripts/build.py

      - name: Commit generated metadata
        run: |
          if [ ! -f latest-versions.json ] || [ ! -f captions.txt ]; then
            echo "Generated metadata files are missing"
            exit 1
          fi

          if git diff --quiet -- latest-versions.json captions.txt && [ -z "$(git ls-files --others --exclude-standard -- latest-versions.json captions.txt)" ]; then
            echo "No metadata changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-versions.json captions.txt

          if git diff --cached --quiet; then
            echo "No metadata changes to commit"
            exit 0
          fi

          date_ist="$(TZ=Asia/Kolkata date '+%Y-%m-%d')"
          time_ist="$(TZ=Asia/Kolkata date '+%H:%M IST')"
          update_count="$(grep -c . updated-apps.txt || true)"

          {
            printf 'chore(releases): update platform assets\n\n'
            printf '📅 Date: %s\n' "$date_ist"
            printf '🕐 Time: %s\n\n' "$time_ist"
            printf '✅ Updated apps (%s):\n' "$update_count"
            sed 's/^/- /' updated-apps.txt
            printf '\n📁 Updated files:\n'
            printf '%s\n' '- latest-versions.json' '- captions.txt'
            printf '\n🤖 Automated by GitHub Actions\n'
          } > commit-message.txt

          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -F commit-message.txt
          git push origin HEAD:main

      - name: Check update summary
        id: summary
        run: |
          if [ -s updated-apps.txt ]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload update summary
        uses: actions/upload-artifact@v4
        with:
          name: app-update-summary
          path: updated-apps.txt
          if-no-files-found: error
          retention-days: 1

  deploy-pages:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest metadata
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Generate app catalog
        run: python3 scripts/catalog.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4

  notify-telegram:
    needs: [build-release, deploy-pages]
    if: needs.build-release.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout app configuration
        uses: actions/checkout@v5

      - name: Download update summary
        uses: actions/download-artifact@v4
        with:
          name: app-update-summary

      - name: Notify Telegram
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "TELEGRAM_BOT_TOKEN is missing"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "TELEGRAM_CHAT_ID is missing"; exit 1; }

          python3 - <<'PY'
          import json
          from pathlib import Path

          apps = json.loads(Path("apps.json").read_text(encoding="utf-8"))
          emojis = {
              app["name"]: app.get("emoji") or "📦"
              for app in apps
              if app.get("enabled", True)
          }
          updates = []
          for line in Path("updated-apps.txt").read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              app, separator, versions = line.partition(": ")
              if not separator or not app.strip() or not versions.strip():
                  raise ValueError(f"Invalid update entry: {line!r}")
              updates.append(f"{emojis.get(app, '📦')} {app} | {versions}")

          if not updates:
              raise SystemExit("Update summary is empty")

          message = (
              "🆕 New Update Available!\n\n"
              + "\n".join(updates)
              + "\n\n⬇️ Download:\n"
              + "https://darkstar085.github.io/app-updater/\n"
          )
          Path("telegram-message.txt").write_text(message, encoding="utf-8")
          PY

          curl --fail --silent --show-error --retry 3 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@telegram-message.txt"
