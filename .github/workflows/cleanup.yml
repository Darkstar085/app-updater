name: Cleanup Old Workflow Runs, Caches and Pages Deployments

on:
  schedule:
    - cron: "0 10 1 * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      deployments: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y gh

      - name: Remove old workflow runs and caches
        run: python3 scripts/cleanup.py
